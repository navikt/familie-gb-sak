apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: gravferd-sak
  namespace: gravferd
  labels:
    team: gravferd
spec:
  envFrom:
    - secret: gravferd-sak-unleash-api-token
  image: {{image}}
  port: 8091
  leaderElection: true
  startup:
    path: /internal/health/liveness
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /internal/health/liveness
    failureThreshold: 10
  readiness:
    path: /internal/health/readiness
    failureThreshold: 10
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - "NAVident"
      replyURLs:
        - "https://gravferd-sak.intern.nav.no/swagger-ui/oauth2-redirect.html"
      singlePageApplication: true
  accessPolicy:
    inbound:
      rules:
        - application: gravferd-sak-frontend
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: populasjonstilgangskontroll
          namespace: tilgangsmaskin
          cluster: prod-gcp
      external:
        - host: gravferd-unleash-api.nav.cloud.nais.io
  replicas:
    min: 1
    max: 2
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 1024Mi
      cpu: 100m
  env:
    - name: TILGANGSMASKIN_API_URL
      value: http://populasjonstilgangskontroll.tilgangsmaskin
    - name: TILGANGSMASKIN_SCOPE
      value: api://prod-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MinRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0"
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
