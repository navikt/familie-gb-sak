apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: familie-gb-sak
  namespace: teamfamilie
  labels:
    team: teamfamilie
spec:
  image: {{image}}
  port: 8091
  startup:
    path: /internal/health/liveness
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /internal/health/liveness
    failureThreshold: 10
  readiness:
    path: /internal/health/readiness
    failureThreshold: 10
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 1024Mi
      cpu: 50m
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MinRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0"
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
