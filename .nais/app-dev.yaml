apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: gravferd-sak
  namespace: gravferd
  labels:
    team: gravferd
spec:
  envFrom:
    - secret: gravferd-sak-unleash-api-token
  image: {{image}}
  port: 8091
  leaderElection: true
  startup:
    path: /internal/health/liveness
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    path: /internal/health/liveness
    failureThreshold: 10
  readiness:
    path: /internal/health/readiness
    failureThreshold: 10
  prometheus:
    enabled: true
    path: /internal/prometheus
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  gcp:
    sqlInstances:
      - type: POSTGRES_18 # Endres typen, forsvinner alle data. Se nais.io for oppgradering
        tier: db-custom-1-3840
        name: gravferd-sak
        diskAutoresize: true
        highAvailability: false
        pointInTimeRecovery: false
        databases:
          - name: gravferd-sak
            envVarPrefix: DB
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - "NAVident"
        groups:
          - id: "928636f4-fd0d-4149-978e-a6fb68bb19de" # 0000-GA-STDAPPS (Prosessering)
          - id: "0faf8545-bd93-4bef-9c6e-9f97ea9ad9f1" # 0000-CA-Gravferd-Veileder
          - id: "f7c3a202-4679-4f6e-b622-fd93c18f1016" # 0000-CA-Gravferd-Saksbehandler
          - id: "b2a8d228-72bf-4f44-9b9a-abfe1b0f5a31" # 0000-CA-Gravferd-Beslutter
          - id: "d1afa9c1-cf0c-4bb4-bc78-7f508f87397b" # 0000-CA-Gravferd-Forvalter
          - id: "a1b518e2-3947-478d-8929-e5d685c47cac" # 0000-GA-Strengt_Fortrolig_Adresse
          - id: "2e1dc582-f762-4510-a660-88bf68fb7128" # 0000-GA-Fortrolig_Adresse
      replyURLs:
        - "https://gravferd-sak.intern.dev.nav.no/swagger-ui/oauth2-redirect.html"
        - "http://localhost:8091/swagger-ui/oauth2-redirect.html"
      singlePageApplication: true
  accessPolicy:
    inbound:
      rules:
        - application: gravferd-sak-frontend
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: populasjonstilgangskontroll
          namespace: tilgangsmaskin
          cluster: dev-gcp
      external:
        - host: gravferd-unleash-api.nav.cloud.nais.io
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 1024Mi
      cpu: 50m
  ingresses:
    - https://gravferd-sak.intern.dev.nav.no
  env:
    - name: TILGANGSMASKIN_API_URL
      value: http://populasjonstilgangskontroll.tilgangsmaskin
    - name: TILGANGSMASKIN_SCOPE
      value: api://dev-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default
    - name: SPRING_PROFILES_ACTIVE
      value: preprod
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MinRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0"
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 99%
