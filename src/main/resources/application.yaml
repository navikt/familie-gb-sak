application:
  name: gravferd-sak

spring:
  application:
    name: gravferd-sak
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8091
  shutdown: graceful

management:
  endpoints.web:
    exposure.include: info, health, prometheus
    base-path: "/internal"
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    oauth:
      use-pkce-with-authorization-code-grant: true
      client-id: ${AZURE_APP_CLIENT_ID}
      scope-separator: ","
    disable-swagger-default-url: true

# Swagger
AUTHORIZATION_URL: https://login.microsoftonline.com/navq.onmicrosoft.com/oauth2/v2.0/authorize
TOKEN_URL: https://login.microsoftonline.com/navq.onmicrosoft.com/oauth2/v2.0/token
API_SCOPE: api://${AZURE_APP_CLIENT_ID}/.default
