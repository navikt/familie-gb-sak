application:
  name: gravferd-sak

spring:
  application:
    name: gravferd-sak
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: 20
      connection-test-query: "select 1"
      max-lifetime: 900000
      minimum-idle: 1
      data-source-properties.stringtype: unspecified # Nødvendig for å kunne sende en String til et json-felt i PostgreSQL
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8091
  shutdown: graceful

management:
  endpoints.web:
    exposure.include: info, health, prometheus
    base-path: "/internal"
  endpoint:
    health:
      probes:
        enabled: true

prosessering:
  continuousRunning.enabled: true
  maxantall: 10
  fixedDelayString:
    in:
      milliseconds: 5000
  delete:
    after:
      weeks: 4

springdoc:
  swagger-ui:
    oauth:
      use-pkce-with-authorization-code-grant: true
      client-id: ${AZURE_APP_CLIENT_ID}
      scope-separator: ","
    disable-swagger-default-url: true

API_SCOPE: api://${AZURE_APP_CLIENT_ID}/.default
