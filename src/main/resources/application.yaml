spring:
  application:
    name: familie-gb-sak
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8091
  shutdown: graceful

management:
  endpoints.web:
    exposure.include: info, health, prometheus
    base-path: "/internal"
  endpoint:
    health:
      probes:
        enabled: true

